name: Build RaceBoox iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Prepare iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --project-name=racebox .
          python3 tool/patch_ios.py

      - name: Get dependencies
        run: flutter pub get
