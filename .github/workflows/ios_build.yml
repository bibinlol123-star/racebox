name: Build RaceBoox iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Prepare iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --project-name=racebox .

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ipa --release --no-codesign

      - name: Find build output
        run: |
          echo "===== IPA ====="
          find build -type f -name "*.ipa" -print || true

          echo "===== XCARCHIVE ====="
          find build -type d -name "*.xcarchive" -print || true

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: racebox-ios-build
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
          if-no-files-found: error
